name: Publish CYD web installer

on:
  workflow_dispatch:
  push:
    branches:
      - feat/greek-slide-planets-rebased
    paths:
      - .github/workflows/pages.yml
      - include/**
      - src/**
      - scripts/**
      - web-installer/**
      - platformio.ini

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware with ephemeral ESP-NOW keys
        run: |
          set -euo pipefail
          export FLIP7_ESPNOW_PMK="$(openssl rand -hex 16)"
          export FLIP7_ESPNOW_LMK="$(openssl rand -hex 16)"
          pio run

      - name: Build web installer artifact
        run: python scripts/build_web_installer.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-installer

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
